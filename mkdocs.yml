site_name: renaissance.py
site_description: Documentation for the renaissance.py project
site_author: TNO ESI, Capgemini

docs_dir: docs
site_dir: site

repo_url: https://github.com/TNO/renaissance.py
repo_name: TNO/renaissance.py
edit_uri: blob/main/docs/

theme:
  name: readthedocs
  locale: en_GB
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate

plugins:
  - search
  - exporter:
      formats:
        pdf:
          enabled: !ENV [MKDOCS_EXPORTER_PDF_ENABLED, false]
  - autorefs:
      resolve_closest: true
      link_titles: external
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths:
            - src
          inventories:
            - https://docs.python.org/3/objects.inv
          options:
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            heading_level: 2
            members_order: source
            show_source: true
            show_signature_annotations: true
            merge_init_into_class: true
            separate_signature: true
            parameter_headings: true
            docstring_section_style: list
            relative_crossrefs: true
            signature_crossrefs: true
            inherited_members: true
            filters:
              - "!^_"

markdown_extensions:
  - admonition
  - codehilite
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.blocks.html

# We explicitly keep docs/templates/ visible in the built site.
# MkDocs excludes top-level /templates/ by default, so we negate that.
exclude_docs: |
  !/templates/
  !/templates/**
  .*

validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: relative_to_docs
    unrecognized_links: warn

