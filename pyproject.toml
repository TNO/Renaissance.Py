# Every repository path named in the documentation, in comments and docstrings, and in feature files exists; checked by
# tools/check_references.py. `exclude` lists the files that are not read; `known_issues` and `stale` list the paths that are
# known to be missing. An entry that no longer applies fails the check, so these lists only shrink.
[tool.check_references]
exclude = [
  "docs/developer/architecture/adr/",                              # the decision records record history
  "docs/developer/architecture/repository_structure_migration.md", # names the paths that the migration creates
]
# Type parameter modernization is documented, but its code is not yet integrated.
known_issues = [
  "src/rejuvenation/migration_type_recipes.py",
  "src/renaissance/recipes/step_runner.py",
  "src/renaissance/recipes/type_parameter_check.py",
  "src/renaissance/recipes/type_parameter_declarations.py",
  "src/renaissance/recipes/type_parameter_localization.py",
  "src/renaissance/recipes/type_parameter_rules.py",
  "src/renaissance/recipes/type_parameter_uses.py",
  "src/renaissance/utils/import_resolution.py",
  "test/recipes/test_step_runner.py",
  "test/recipes/test_type_parameter_check.py",
  "test/recipes/test_type_parameter_check_convert.py",
  "test/recipes/test_type_parameter_check_localize.py",
  "test/recipes/test_type_parameter_check_orphaned.py",
  "test/recipes/test_type_parameter_check_properties.py",
  "test/recipes/test_type_parameter_check_variance.py",
  "test/recipes/test_type_parameter_declarations.py",
  "test/recipes/test_type_parameter_localization.py",
  "test/recipes/test_type_parameter_rules.py",
  "test/rejuvenation/test_migration_type_recipes.py",
  "test/utils/test_import_resolution.py",
]
# Paths that do not exist yet.
stale = [
  "docs/assets/images/architecture/", # allowed locations of shared images
  "docs/assets/images/logos/",
  "docs/assets/images/notation/",
]

# The dependency rules of docs/developer/architecture/repository_structure.md. This is their single source of truth.
# The module lists map today's packages onto the target units; each list shrinks to one package as the migration proceeds.
# A test module follows the rules of the unit it tests. Every ignore_imports entry is a known violation, with its reason.
[tool.importlinter]
root_packages = [ "renaissance", "rejuvenation", "test", "tools" ]

[[tool.importlinter.contracts]]
id = "layers"
name = "Layers, and the order of the core sub-packages"
type = "layers"
layers = [
  # recipes
  "renaissance.recipes : rejuvenation : test.recipes : test.examples : test.unit.recipes",
  # parser_bindings
  """renaissance.integrations : renaissance.parser_bindings
    : test.c_cpp : test.lst : test.unit.parser_bindings : test.unit.shared.factories""",
  # core.processing
  "renaissance.core.processing : test.unit.core.processing",
  # core.rewrite
  "renaissance.core.rewrite : test.unit.core.rewrite",
  # core.match
  "renaissance.core.match : test.unit.core.match : test.unit.shared.utils_for_tests",
  # core.pattern
  "renaissance.core.pattern : test.unit.core.pattern",
  # core.model
  "renaissance.core.model : test.unit.core.model : test.search_strategies : test.conftest",
  # core.navigate
  "renaissance.core.navigate : test.unit.core.navigate",
]
ignore_imports = [
  # Unit tests of the core that parse real code instead of using test doubles.
  "test.unit.core.processing.test_ast_processor___find_match -> renaissance.integrations.clang",
  "test.unit.core.processing.test_batch_ast_processor -> renaissance.integrations.clang",
  "test.unit.core.processing.test_recipe_ast_processor -> renaissance.integrations.clang",
  "test.unit.core.processing.test_ast_processor___semantic_kind -> renaissance.parser_bindings.python.ast.factory",
  "test.unit.core.processing.test_ast_processor___semantic_kind -> renaissance.parser_bindings.python.ast",
  "test.unit.core.rewrite.test_ast_rewriter___composition -> renaissance.integrations.clang",
  "test.unit.core.rewrite.test_ast_rewriter___composition -> renaissance.parser_bindings.python.ast.factory",
  "test.unit.core.rewrite.test_ast_rewriter___composition -> renaissance.parser_bindings.python.ast",
  "test.unit.core.rewrite.test_ast_rewriter___composition -> test.unit.shared.factories",
  "test.unit.core.rewrite.test_ast_rewriter___remove_replace_insert -> renaissance.integrations.clang",
  "test.unit.core.rewrite.test_ast_rewriter___remove_replace_insert -> renaissance.parser_bindings.python.ast.factory",
  "test.unit.core.rewrite.test_ast_rewriter___remove_replace_insert -> renaissance.parser_bindings.python.ast",
  "test.unit.core.rewrite.test_ast_rewriter___remove_replace_insert -> test.unit.shared.factories",
  "test.unit.core.rewrite.test_ast_rewriter___semantics -> renaissance.parser_bindings.python.ast.factory",
  "test.unit.core.rewrite.test_ast_rewriter___semantics -> renaissance.parser_bindings.python.ast",
  "test.unit.core.match.test_match_finder___one_and_all_params -> renaissance.integrations.clang",
  "test.unit.core.match.test_match_finder___multi_assignments -> renaissance.parser_bindings.python.ast.factory",
  "test.unit.core.match.test_match_finder___multi_assignments -> renaissance.parser_bindings.python.ast",
  "test.unit.core.match.test_match_finder___match_tree -> renaissance.integrations.clang",
  "test.unit.core.match.test_match_finder___match_tree -> renaissance.parser_bindings.python.ast.factory",
  "test.unit.core.match.test_match_finder___match_tree -> renaissance.parser_bindings.python.ast",
  "test.unit.core.match.test_match_finder___pattern_match -> renaissance.parser_bindings.python.ast.factory",
  "test.unit.core.match.test_match_finder___pattern_match -> renaissance.parser_bindings.python.ast",
  "test.unit.core.model.test_ast_finder___parsed_c -> test.unit.shared.factories",
  "test.unit.core.model.test_ast_finder___predicate -> renaissance.parser_bindings.python.ast",
  "test.unit.core.model.test_ast_finder___semantic_kind -> renaissance.parser_bindings.python.ast",
  # A test of the node protocol that checks its use by the matcher.
  "test.unit.core.model.test_node_protocol -> renaissance.core.match",
  # A test of the batch processor that runs a real recipe step instead of a test double.
  "test.unit.core.processing.test_batch_ast_processor -> renaissance.recipes",
]

# Exhaustive needs a container, which the layers contract cannot have; this contract lists the core sub-packages, not their order.
[[tool.importlinter.contracts]]
id = "core-exhaustive"
name = "Every core sub-package is a layer of the layers contract"
type = "layers"
containers = [ "renaissance.core" ]
layers = [ "match : model : navigate : pattern : processing : rewrite" ]
exhaustive = true
broken_contract_guidance = "Add the new core sub-package here, and to its place in the order of the layers contract."

[[tool.importlinter.contracts]]
id = "bindings-use-model-pattern-matching"
name = "Parser bindings use only core.model, core.pattern and core.match"
type = "forbidden"
source_modules = [
  "renaissance.integrations",
  "renaissance.parser_bindings",
  "test.c_cpp",
  "test.lst",
  "test.unit.parser_bindings",
  "test.unit.shared.factories",
]
forbidden_modules = [
  "renaissance.core.processing",
  "renaissance.core.rewrite",
]
allow_indirect_imports = true
ignore_imports = [
  # Tests of the Python bindings that check the effect of a rewrite on their nodes.
  "test.unit.parser_bindings.python.ast.test_factory___offset_encoding -> renaissance.core.rewrite",
  "test.unit.parser_bindings.python.ast.test_factory___protocol_metadata -> renaissance.core.rewrite",
]

[[tool.importlinter.contracts]]
id = "recipes-without-bindings"
name = "Recipes use parser bindings only when they are parser specific"
type = "forbidden"
source_modules = [
  "renaissance.recipes",
  "rejuvenation",
  "test.recipes",
  "test.examples",
  "test.unit.recipes",
]
forbidden_modules = [
  "renaissance.integrations",
  "renaissance.parser_bindings",
  "test.c_cpp",
  "test.lst",
  "test.unit.parser_bindings",
  "test.unit.shared.factories",
]
allow_indirect_imports = true
broken_contract_guidance = """
Express the recipe in terms of the core. A recipe that relies on what one parser provides is parser specific:
declare each binding it depends on in ignore_imports, with the reason shown by the code that needs it."""
# Declared dependencies of parser-specific recipes come first, then the known violations.
ignore_imports = [
  # PythonExtractor walks the nodes of the Python standard library ast parser.
  "renaissance.recipes.python_extractor.python_extractor -> renaissance.parser_bindings.python.ast",
  # The code graph extractors parse with tree-sitter and walk its LST.
  "renaissance.recipes.code_graph_extractor.code_graph_extractor -> renaissance.parser_bindings.tree_sitter",
  # Parsing a file and creating patterns without naming the parser is missing in the core.
  "renaissance.recipes.python_refactoring -> renaissance.parser_bindings.python.libcst",
  "renaissance.recipes.python_refactoring -> renaissance.parser_bindings.python.ast.factory",
  "renaissance.recipes.python_refactoring -> renaissance.parser_bindings.python.ast",
  "rejuvenation.cli -> renaissance.parser_bindings.python.ast",
  "rejuvenation.cli -> renaissance.parser_bindings.project",
  "test.recipes.test_python_refactoring -> renaissance.parser_bindings.python.libcst",
  "test.recipes.test_python_refactoring -> renaissance.parser_bindings.python.ast.factory",
  "test.recipes.test_python_refactoring -> renaissance.parser_bindings.python.ast",
  "test.recipes.test_refactor_with_rewrite -> renaissance.parser_bindings.python.ast",
  "test.recipes.test_unit_to_pytest -> renaissance.parser_bindings.python.ast",
  "test.recipes.test_cleanup_refactoring -> test.unit.shared.factories",
  # Access to the parameters of a function is missing in the core; convert_function reads stdlib ast.
  "renaissance.recipes.unit_to_pytest -> renaissance.parser_bindings.python.ast",
  # A pattern factory protocol is missing in the core; CPPPatternFactory is used in an annotation only.
  "renaissance.recipes.refactor_actions.ast_refactor_actions -> renaissance.integrations.clang.c_pattern_factory",
  # The examples that show how one parser represents code become unit tests of that binding; the others are violations.
  "rejuvenation.cpp_clang_lst_example -> renaissance.integrations.**",
  "rejuvenation.refactor_examples_different_styles -> renaissance.integrations.**",
  "rejuvenation.refactor_with_nested_compositions -> renaissance.integrations.**",
  "rejuvenation.remove_unused_variable -> renaissance.integrations.**",
  "rejuvenation.replace_if_with_ternary -> renaissance.integrations.**",
  "rejuvenation.walk_compilation_database -> renaissance.integrations.**",
  "test.examples.test_descendant_search -> renaissance.integrations.**",
  "test.examples.test_descendant_search -> test.unit.shared.factories",
  "test.examples.test_examples -> renaissance.integrations.**",
  "test.examples.test_examples -> test.unit.shared.factories",
]

