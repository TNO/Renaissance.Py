[build-system]
requires = ["hatchling>=1.27"]  # PEP 639 license metadata
build-backend = "hatchling.build"

[project]
name = "renaissance"
version = "0.0.1"
description = "Renaissance reimplementation in Python"
readme = "README.md"
authors = [
    { name = "Pierre van de Laar", email = "pierre.vandelaar@tno.nl" },
    { name = "Jinmin Hu", email = "jinmin.hu@capgemini.com" },
    { name = "Luna Li", email = "luna.li@capgemini.com" }
]
license = "EPL-2.0"
license-files = ["LICENSE"]
requires-python = "==3.14.9"
dependencies = [
    "arpeggio>=2.0",
    "pyperclip>=1.8",
    "libclang-ng==22.1.4.2",
    "more-itertools>=10.0",
    "networkx>=3.0",
    "pyhamcrest>=2.1",
    "termcolor>=2.0",
    "tree-sitter>=0.25",
    "tree-sitter-python==0.25.0",
    "tree-sitter-cpp==0.23.4",
    "tree-sitter-java==0.23.5",
    "libcst>=1.8.6",
    "hypothesmith>=0.3.3",
    "autopep8>=2.0",
    "flake8>=7.0",
]

[dependency-groups]
test = [
    "hypothesis>=6.152.4",
    "hypothesmith>=0.3.3",
    "parameterized>=0.9",
    "pytest>=8.0",
    "pytest-bdd==9.0.0",
    "pytest-cov>=7.0",
    "pytest-mock>=3.15",
    "pytest-profiling>=1.8",
    "coverage>=7.0",
]
lint = [
    "ruff>=0.5",
    "codespell>=2.4",
    "pyright>=1.1",
    "pymarkdownlnt>=0.9",
]
dev = [
    {include-group = "test"},
    {include-group = "lint"},
    {include-group = "docs"},
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.0",
    "mkdocstrings[python]>=0.25",
    "mkdocs-autorefs>=1.0",
    "mkdocs-exporter>=6.0",
]

[project.urls]
Homepage = "https://github.com/TNO/Renaissance.Py"
Issues = "https://github.com/TNO/Renaissance.Py/issues"

[project.scripts]
rejuvenate = "rejuvenation.cli:refactor"

[tool.pytest.ini_options]
testpaths = ["test", "features"]
pythonpath = ["src", "test", "features"]
norecursedirs = ["features/targets", "*.egg", ".*", "_darcs", "build", "CVS", "dist", "node_modules", "venv", "{arch}"]
markers = [
    "xfail_prepend_descendant_first: known-failing rewrite-semantics.feature Examples row (see features/steps/conftest.py)",
    "xfail_append_ancestor_first: known-failing rewrite-semantics.feature Examples row (see features/steps/conftest.py)",
    "xfail_surround_descendant_first_shared_start: known-failing rewrite-semantics.feature Examples row (see features/steps/conftest.py)",
    "xfail_surround_ancestor_first_shared_end: known-failing rewrite-semantics.feature Examples row (see features/steps/conftest.py)",
]

[tool.coverage.run]
source = ["src"]
omit = ["test/*", "features/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 140
src = ["src", "test", "features"]
# Test inputs: tests can assert their content (including line numbers), so neither Ruff nor the guard rails may change them.
# tools/check_copyright.py reads this list too; it holds the test inputs only.
extend-exclude = ["features/targets"]
force-exclude = true

[tool.ruff.format]
# Ruff's default keeps each file's own line ending; LF matches .gitattributes, also on Windows.
line-ending = "lf"

[tool.ruff.lint]
select = [
    "A","AIR", "ASYNC", "COM", "CPY", "D", "DJ", "DTZ", "E", "EXE",
    "F", "FA", "FAST", "FLY", "FURB", "G", "I", "ICN", "INT", "ISC",
    "LOG", "N", "NPY", "PTH", "PD", "PERF", "PGH", "PIE", "PLC", "PLE", "PYI",
    "Q", "RSE", "SIM", "SLOT", "T10", "TC", "TID", "UP", "W", "YTT",
    # ANN is adopted code by code as each phase clears it; the rest stay unselected so the
    # lint budget keeps counting them. Still open: ANN001, ANN201, ANN202.
    "ANN002", "ANN003", "ANN204", "ANN205", "ANN401",
]
#select = ["ALL"]  # goal of issue 
ignore = [
    "D203",   # conflicts with D211 (no blank line before class) — keep D211
    "D213",   # conflicts with D212 (summary on the first line) — keep D212
    "COM812", # conflicts when used with the formatter - use formatter
    "UP037",  # Python 3.14+ evaluates annotations lazily
    # When we move to 3.15, we will remove the TC001–TC003 ignores and use lazy imports where needed.
    "TC001",  # Python 3.14+ no longer requires TYPE_CHECKING for annotations
    "TC002",  # Python 3.14+ no longer requires TYPE_CHECKING for annotations
    "TC003",  # Python 3.14+ no longer requires TYPE_CHECKING for annotations
    "FIX",    # FIXMEs, TODOs etc mark out-of-scope work from said PR
]

[tool.ruff.lint.flake8-annotations]
# ANN002/ANN003 require variadics to be annotated; forwarding ones are genuinely heterogeneous, so Any is allowed there.
allow-star-arg-any = true

[tool.ruff.lint.flake8-copyright]
author = "TNO"

[tool.pyright]
typeCheckingMode = "off"
#typeCheckingMode = "strict"
include = ["src", "test", "tools", "features"]
# features/targets holds deliberately malformed sample input, so it is parsed by the tests rather than type-checked.
exclude = ["features/targets", "**/node_modules", "**/__pycache__", "**/.*", ".venv"]
extraPaths = ["src", "test", "features"]

[tool.pymarkdown]
plugins.md013.heading_line_length = 140
plugins.md013.line_length = 140
plugins.md013.tables = false
plugins.md013.code_blocks = false
# Python-Markdown needs 4-space anchored list indentation; md007 expects CommonMark's 3, pml101 checks the 4-space style.
plugins.md007.enabled = false
plugins.pml101.enabled = true
extensions.markdown-tables.enabled = true
