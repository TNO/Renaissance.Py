[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling>=1.33" ]  # PEP 639 license metadata

[project]
# TODO - rename to renaissance-py?
# If so, folder src/renaissance becomes src/renaissance_py
name = "renaissance"
version = "0.0.1"
description = "Toolkit for software understanding and modernization"
readme = "README.md"
license = "EPL-2.0"
license-files = [ "LICENSE" ]
authors = [
  { name = "Pierre van de Laar", email = "pierre.vandelaar@tno.nl" },
  { name = "Jinmin Hu", email = "jinmin.hu@capgemini.com" },
  { name = "Luna Li", email = "luna.li@capgemini.com" }
]
requires-python = ">=3.14.10,<3.15"
dependencies = [
  "arpeggio>=2.0.3",
  "libclang-ng>=22.1.4.2",
  "libcst>=1.9",
  "more-itertools>=11.2.1",
  "networkx>=3.7",
  "pyperclip>=1.11",
  "ruff>=0.17.5",
  "termcolor>=3.3",
  "tree-sitter>=0.26.1",
  "tree-sitter-cpp>=0.23.4",
  "tree-sitter-java>=0.23.5",
  "tree-sitter-python>=0.25",
]
urls.Homepage = "https://github.com/TNO/Renaissance.Py"
urls.Issues = "https://github.com/TNO/Renaissance.Py/issues"
# TODO command will fail after a normal install as its reference is outside
# the wheel / the renaissance package
scripts.rejuvenate = "rejuvenation.cli:refactor"

[dependency-groups]
dev = [
  { include-group = "test" },
  { include-group = "type" },
  { include-group = "docs" },
  { include-group = "lint" },
]
test = [
  "coverage>=7.17.3",
  "hypothesis>=6.170.15",
  "hypothesmith>=0.3.3",
  "parameterized>=0.9",
  "pyhamcrest>=2.1",
  "pytest>=9.2",
  "pytest-bdd>=9.0.1",
  "pytest-cov>=7.1",
  "pytest-mock>=3.17",
  "pytest-profiling>=1.8.1",
]
type = [
  "pyright>=1.1.414",
]
docs = [
  "mkdocs>=1.6.1",
  "mkdocs-autorefs>=1.4.5",
  "mkdocs-exporter>=6.2",
  "mkdocs-material>=9.8.1",
  "mkdocstrings[python]>=1.0.8",
]
lint = [
  "codespell>=2.4.3",
  "import-linter>=2.15",
  "pymarkdownlnt>=0.9.42",
  "pyproject-fmt>=2.30.6",
  # ruff is a direct dependency
]

[tool.ruff]
line-length = 140
src = [ "features", "src", "test" ]
# Test inputs: tests can assert their content (including line numbers), so neither Ruff nor the guard rails may change them.
# tools/check_copyright.py reads this list too; it holds the test inputs only.
extend-exclude = [ "features/targets" ]
force-exclude = true
# Ruff's default keeps each file's own line ending; LF matches .gitattributes, also on Windows.
format.line-ending = "lf"
lint.select = [
  "A",
  "AIR",
  # ANN is adopted code by code as each phase clears it; the rest stay unselected so the
  # lint budget keeps counting them. Still open: ANN001, ANN201, ANN202.
  "ANN002",
  "ANN003",
  "ANN204",
  "ANN205",
  "ANN401",
  "ASYNC",
  "COM",
  "CPY",
  "D",
  "DJ",
  "DTZ",
  "E",
  "EXE",
  "F",
  "FA",
  "FAST",
  "FLY",
  "FURB",
  "G",
  "I",
  "ICN",
  "INT",
  "ISC",
  "LOG",
  "N",
  "NPY",
  "PD",
  "PERF",
  "PGH",
  "PIE",
  "PLC",
  "PLE",
  "PTH",
  "PYI",
  "Q",
  "RSE",
  "SIM",
  "SLOT",
  "T10",
  "TC",
  "TID",
  "UP",
  "W",
  "YTT",
]
# lint.select = [ "ALL" ]  # goal of issue
lint.ignore = [
  "COM812", # conflicts when used with the formatter - use formatter
  "D203",   # conflicts with D211 (no blank line before class) — keep D211
  "D213",   # conflicts with D212 (summary on the first line) — keep D212
  "FIX",    # FIXMEs, TODOs etc mark out-of-scope work from said PR
  # When we move to 3.15, we will remove the TC001–TC003 ignores and use lazy imports where needed.
  "TC001",  # Python 3.14+ no longer requires TYPE_CHECKING for annotations
  "TC002",  # Python 3.14+ no longer requires TYPE_CHECKING for annotations
  "TC003",  # Python 3.14+ no longer requires TYPE_CHECKING for annotations
  "UP037",  # Python 3.14+ evaluates annotations lazily
]
# ANN002/ANN003 require variadics to be annotated; forwarding ones are genuinely heterogeneous, so Any is allowed there.
lint.flake8-annotations.allow-star-arg-any = true
lint.flake8-copyright.author = "TNO"
lint.flake8-tidy-imports.ban-relative-imports = "all"

[tool.codespell]
# NotIn and ANC are identifiers in the code, not misspellings.
ignore-words-list = "NotIn,ANC"

[tool.pyproject-fmt]
generate_python_version_classifiers = false

[tool.pyright]
typeCheckingMode = "off"
# typeCheckingMode = "strict"
include = [ "features", "src", "test", "tools" ]
# features/targets holds deliberately malformed sample input, so it is parsed by the tests rather than type-checked.
exclude = [ "**/.*", "**/__pycache__", "**/node_modules", ".venv", "features/targets" ]
extraPaths = [ "features", "src", "test" ]

[tool.pytest]
ini_options.testpaths = [ "test", "features" ]
ini_options.pythonpath = [ "features", "src", "test" ]
ini_options.norecursedirs = [
  "*.egg",
  ".*",
  "_darcs",
  "{arch}",
  "build",
  "CVS",
  "dist",
  "features/targets",
  "node_modules",
  "venv"
]
ini_options.markers = [
  "xfail_append_ancestor_first: known-failing rewrite_semantics.feature Examples row (see features/steps/conftest.py)",
  """\
  xfail_prepend_descendant_first: known-failing rewrite_semantics.feature Examples row (see features/steps/conftest.py)\
  """,
  """\
  xfail_surround_ancestor_first_shared_end: known-failing rewrite_semantics.feature Examples row (see \
  features/steps/conftest.py)\
  """,
  """\
  xfail_surround_descendant_first_shared_start: known-failing rewrite_semantics.feature Examples row (see \
  features/steps/conftest.py)\
  """,
]

[tool.coverage]
run.source = [ "src" ]
run.omit = [ "features/*", "test/*" ]
report.skip_covered = false
report.show_missing = true

# The layout rules of docs/developer/architecture/repository_structure.md: the tests and the documentation mirror the code.
# This is their single source of truth, checked by tools/check_layout.py. Each mirror maps every unit under `code` onto its
# counterpart; `exempt` lists units without a counterpart, `extra` lists paths in the mirror that are no counterpart. With
# `aspects = "instead"`, the tests of a module may instead be split into several files, one per aspect, `test_x___<aspect>.py`;
# with `aspects = "beside"`, the page of a module `x.md` may have pages per aspect `x___<aspect>.md` beside it. `{name}` is the
# last part of `{path}`. The migration adds the mirrors of each part of src/renaissance once that part is in its target place.
[[tool.check_layout.mirrors]]
code = "tools"
units = "modules"
mirror = "test/tools/test_{path}.py"
aspects = "instead"
exempt = [ "check_doc_images_policy", "mkdocs_hooks", "ruff_stats" ]

[[tool.check_layout.mirrors]]
code = "tools/shared"
units = "modules"
mirror = "test/tools/shared/test_{path}.py"
aspects = "instead"

[[tool.check_layout.mirrors]]
code = "tools"
units = "modules"
mirror = "docs/developer/tools/{path}.md"
exempt = [
  "check_doc_images_policy", # documented in docs/documentation_system/enforcement/image_policy_enforcement.md
  "lint_budget",             # documented in docs/developer/coding_conventions.md
  "mkdocs_hooks",
  "ruff_stats",
]
extra = [
  "docs/developer/tools/index.md",
  "docs/developer/tools/check_layering.md", # Import Linter, configured in [tool.importlinter]
]

[[tool.check_layout.mirrors]]
code = "src/renaissance/core"
units = "packages"
mirror = "test/unit/core/{path}/"
extra = [ "test/unit/core/model/shared/" ]  # test helpers

[[tool.check_layout.mirrors]]
code = "src/renaissance/core/model"
units = "modules"
mirror = "test/unit/core/model/test_{path}.py"
aspects = "instead"
# No unit tests of their own yet.
exempt = [ "ast_factory", "ast_node", "ast_shower", "format", "node_utils", "semantic_kind", "siblings", "text_utils" ]

[[tool.check_layout.mirrors]]
code = "src/renaissance/core/navigate"
units = "modules"
mirror = "test/unit/core/navigate/test_{path}.py"
aspects = "instead"
exempt = [ "protocols" ]  # Protocols only: Pyright checks that nodes implement them.

[[tool.check_layout.mirrors]]
code = "src/renaissance/core/pattern"
units = "modules"
mirror = "test/unit/core/pattern/test_{path}.py"
aspects = "instead"
exempt = [ "placeholders" ]  # No unit tests of its own yet.

[[tool.check_layout.mirrors]]
