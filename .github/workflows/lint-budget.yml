# Fixing a ruff or pyright issue drops its count below the budget in lint-budget.json. A pull
# request is never failed for that, so this workflow ratchets the budgets down on main instead and
# proposes the lowered lint-budget.json in a pull request of its own, like a dependency bump.

name: lint budget

on:
  push:
    branches: ["main"]
  # Weekly as well, because ruff, pyright and dependency updates also change the counts.
  schedule:
    - cron: "0 6 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "lint-budget"
  cancel-in-progress: true

jobs:
  lower-budgets:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      # Unlike the default GITHUB_TOKEN, an app token triggers the checks on the pull request it
      # opens, which auto-merge waits for. The step is skipped until the app variable is set.
      - name: Mint a GitHub App token
        id: app-token
        if: vars.LINT_BUDGET_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ vars.LINT_BUDGET_APP_CLIENT_ID }}
          private-key: ${{ secrets.LINT_BUDGET_APP_PRIVATE_KEY }}
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
      - name: Install dependencies
        run: uv sync --group dev
      # Without --check the script writes the lowered counts into lint-budget.json; it still fails
      # when a count exceeds its budget, which must not be papered over by a budget bump.
      - name: Lower the budgets to the current issue counts
        run: uv run python tools/lint_budget.py
      - name: Open a pull request for the lowered budgets
        id: pull-request
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          # Committing through the API instead of git lets GitHub sign the commit, as branch protection requires.
          sign-commits: true
          add-paths: lint-budget.json
          branch: chore/lower-lint-budget
          delete-branch: true
          commit-message: "chore: lower the ruff and pyright issue budgets"
          title: "chore: lower the ruff and pyright issue budgets"
          body: |
            The ruff and pyright issue counts on `main` are below the budgets in `lint-budget.json`.
            This pull request adopts the current counts as the new budgets, so the improvement cannot be undone.

            Generated by the `lint budget` workflow running `python tools/lint_budget.py`.
          labels: lint-budget
      - name: Enable auto-merge
        if: steps.pull-request.outputs.pull-request-operation == 'created'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ steps.pull-request.outputs.pull-request-url }}
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
