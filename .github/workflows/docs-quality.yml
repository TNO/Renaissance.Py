name: docs quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
      # uv installs the interpreter pinned by requires-python in pyproject.toml.
      - name: Install dependencies
        run: uv sync --group dev
      - name: Build documentation strictly
        run: uv run mkdocs build --strict
      - name: Check documentation image policy
        run: uv run python tools/check_doc_images_policy.py
      - name: Check spelling
        run: uv run codespell ./docs
      - name: Lint markdown
        run: uv run pymarkdown scan -r ./docs

  ci-passed:
    name: Docs CI passed
    if: always()
    needs: [docs]
    runs-on: ubuntu-latest
    steps:
      - name: Check docs result
        run: |
          if [ "${{ needs.docs.result }}" != "success" ]; then
            echo "docs job failed or was cancelled"
            exit 1
          fi
