name: Docs quality

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install documentation tooling
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs mkdocs[i18n] mkdocs-material mkdocstrings[python] mkdocs-exporter mkdocs-autorefs
      - name: Build documentation strictly
        run: mkdocs build --strict
      - name: Check documentation image policy
        run: python tools/check_doc_images_policy.py
