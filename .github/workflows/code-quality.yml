# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: code quality

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

# Avoid overlapping Pages deployments; let the latest push win.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
      # uv installs the interpreter pinned by requires-python in pyproject.toml.
      - name: Install dependencies
        run: uv sync --group dev
      - name: Lint with ruff
        run: uv run ruff check ./src ./test ./tools ./features
      - name: Type check with pyright
        run: uv run pyright ./src ./test ./tools ./features
      - name: Check ruff and pyright issue budgets
        run: uv run python tools/lint_budget.py --check
      - name: Check spelling with codespell
        run: uv run codespell ./src ./test ./tools ./features --ignore-words-list=NotIn,ANC
      - name: Test with pytest and collect coverage
        run: uv run coverage run -m pytest ./test ./features
      - name: Coverage report
        run: uv run coverage report
      - name: Generate HTML coverage report
        run: uv run coverage html
      - name: Upload HTML coverage report artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-html-report
          path: htmlcov/
      # Only publish a single, unambiguous site to GitHub Pages: from the main branch build.
      - name: Build documentation with mkdocs
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: uv run mkdocs build --strict
      # Docs are published at the site root and the coverage report is nested
      # under /coverage/, so both are reachable from the same Pages deployment.
      - name: Assemble combined Pages site (docs + coverage report)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          mkdir -p _site/coverage
          cp -r site/. _site/
          cp -r htmlcov/. _site/coverage/
      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site/
      - name: Build release distributions
        run: |
          # NOTE: put your own distribution build steps here.
          # python -m pip install build
          # python -m build

  deploy-coverage-pages:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy coverage report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1

  ci-passed:
    name: CI passed
    if: always()
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Check build result
        run: |
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "build job failed or was cancelled"
            exit 1
          fi
